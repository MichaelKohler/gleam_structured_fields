name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - name: Install main project dependencies
        run: gleam deps download

      - name: Check format
        run: gleam format --check src test

      - name: Install script dependencies
        run: gleam deps download
        working-directory: scripts
      - name: Clone httpwg test cases
        run: git clone --depth=1 https://github.com/httpwg/structured-field-tests.git /tmp/structured-field-tests
      - name: Generate httpwg test files
        run: gleam run -- /tmp/structured-field-tests
        working-directory: scripts
      - name: Format generated test files
        run: gleam format test/httpwg

      - name: Test
        run: gleam test
